    name: v1
    schema:
      description: |-
        OpenBaoNamespace is used to represent an isolated OpenBao namespace with admin authentication.
        Hierarchical nesting is supported via the parentRef field.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: OpenBaoNamespaceSpec defines the desired state of OpenBaoNamespace.
          properties:
            auth:
              description: Auth configures the authentication method for accessing
                the OpenBao namespace.
              properties:
                appRole:
                  description: AppRole configures AppRole authentication for machine
                    access.
                  properties:
                    enabled:
                      default: true
                      description: Enabled enables AppRole authentication.
                      type: boolean
                    secretIdNumUses:
                      default: 0
                      description: SecretIdNumUses is the maximum number of times
                        the SecretID can be used.
                      type: integer
                    secretIdTTL:
                      default: 24h
                      description: SecretIdTTL is the TTL for the generated SecretID.
                      type: string
                    secretRef:
                      description: SecretRef specifies where the AppRole credentials
                        are to be stored.
                      properties:
                        name:
                          description: Name is the name of the secret to create.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the namespace of the secret.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    tokenMaxTTL:
                      default: 24h
                      description: TokenMaxTTL is the maximum TTL for tokens issued
                        via AppRole.
                      type: string
                    tokenTTL:
                      default: 1h
                      description: TokenTTL is the TTL for tokens issued via AppRole.
                      type: string
                  required:
                  - secretRef
                  type: object
                jwt:
                  description: JWT configures JWT authentication for machine access
                    using an OIDC/JWKS provider.
                  properties:
                    boundAudiences:
                      description: BoundAudiences is the expected audiences of the
                        JWT.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    boundIssuer:
                      description: BoundIssuer is the expected issuer of the JWT.
                      minLength: 1
                      type: string
                    boundSubject:
                      description: BoundSubject is the expected subject of the JWT.
                      type: string
                    enabled:
                      default: true
                      description: Enabled enables JWT authentication.
                      type: boolean
                    jwksUrl:
                      description: JWKSURL is the JWKS URL for the JWT issuer.
                      type: string
                    jwtValidationPubkeys:
                      description: JWTValidationPubkeys is a list of PEM-encoded public
                        keys to validate the JWT signature offline.
                      items:
                        type: string
                      type: array
                    oidcDiscoveryCaPem:
                      description: OIDCDiscoveryCAPem is the PEM-encoded CA cert used
                        to validate the OIDC discovery URL.
                      type: string
                    oidcDiscoveryUrl:
                      description: OIDCDiscoveryURL is the OIDC Discovery URL for
                        the JWT issuer.
                      type: string
                    tokenMaxTTL:
                      default: 24h
                      description: TokenMaxTTL is the maximum TTL for tokens issued
                        via JWT.
                      type: string
                    tokenTTL:
                      default: 1h
                      description: TokenTTL is the TTL for tokens issued via JWT.
                      type: string
                    userClaim:
                      default: sub
                      description: UserClaim is the claim used to uniquely identify
                        the user.
                      type: string
                  required:
                  - boundAudiences
                  - boundIssuer
                  type: object
                oidc:
                  description: OIDC configures OIDC authentication for interactive
                    access.
                  properties:
                    allowedGroups:
                      description: AllowedGroups specifies which Keycloak groups are
                        allowed to authenticate.
                      items:
                        type: string
                      type: array
                    clientId:
                      description: ClientID is the OpenID Connect client ID in Keycloak.
                      type: string
                    clientSecretRef:
                      description: ClientSecretRef is a reference to the K8s Secret
                        containing the client secret.
                      properties:
                        name:
                          description: Name is the name of the secret to create.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the namespace of the secret.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    enabled:
                      default: true
                      description: Enabled enables OIDC authentication.
                      type: boolean
                    keycloakBaseUrl:
                      description: |-
                        KeycloakBaseURL is the base URL of the Keycloak server (without realm path).
                        The operator appends /realms/<realmId> to build the full OIDC discovery URL.
                        Example: "http://keycloak.platform-mesh-system.svc.cluster.local/keycloak"
                      type: string
                    providerConfigRef:
                      default: default
                      description: |-
                        ProviderConfigRef is the name of the Crossplane ProviderConfig for Keycloak.
                        Used when realmId is set (OIDC client provisioning via Crossplane).
                      type: string
                    realmId:
                      description: |-
                        RealmID is the Keycloak realm ID to use for OIDC provisioning.
                        When omitted, the realm ID is derived automatically from the KCP workspace path:
                        for workspace path "root:orgs:<org-name>:<account-name>", realmId = "<org-name>".
                        When set explicitly, this value takes precedence over the derived value.
                      type: string
                  type: object
              type: object
              x-kubernetes-validations:
              - message: exactly one of oidc, appRole, or jwt must be specified
                rule: '(has(self.oidc) ? 1 : 0) + (has(self.appRole) ? 1 : 0) + (has(self.jwt)
                  ? 1 : 0) == 1'
              - message: keycloakBaseUrl is required when OIDC is enabled
                rule: '!has(self.oidc) || !self.oidc.enabled || (has(self.oidc.keycloakBaseUrl)
                  && size(self.oidc.keycloakBaseUrl) > 0)'
              - message: clientId is required when OIDC is enabled
                rule: '!has(self.oidc) || !self.oidc.enabled || (has(self.oidc.clientId)
                  && size(self.oidc.clientId) > 0)'
              - message: exactly one of oidcDiscoveryUrl, jwksUrl, or jwtValidationPubkeys
                  must be provided when JWT is enabled
                rule: '!has(self.jwt) || !self.jwt.enabled || ((has(self.jwt.oidcDiscoveryUrl)
                  && size(self.jwt.oidcDiscoveryUrl) > 0 ? 1 : 0) + (has(self.jwt.jwksUrl)
                  && size(self.jwt.jwksUrl) > 0 ? 1 : 0) + (has(self.jwt.jwtValidationPubkeys)
                  && size(self.jwt.jwtValidationPubkeys) > 0 ? 1 : 0) == 1)'
            openBaoNamespace:
              description: |-
                OpenBaoNamespace is the desired namespace segment name in OpenBao.
                Required when parentRef is set; ignored for root-level namespaces.
              maxLength: 63
              pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
              type: string
            parentRef:
              description: |-
                ParentRef is an optional reference to a parent OpenBaoNamespace CR.
                When omitted, the namespace path is derived from the kcp workspace path (root-level behavior).
              properties:
                name:
                  description: Name is the metadata.name of the parent OpenBaoNamespace
