                  maxLength: 253
                  minLength: 1
                  type: string
              required:
              - name
              type: object
            secretEngines:
              description: SecretEngines defines the list of secret engines to mount
                in this namespace
              items:
                description: SecretEngineSpec defines a single secret engine mount
                  configuration
                properties:
                  config:
                    description: Config defines the mount/tune configuration
                    properties:
                      allowedResponseHeaders:
                        description: AllowedResponseHeaders are HTTP headers the plugin
                          is allowed to emit
                        items:
                          type: string
                        type: array
                      auditNonHMACRequestKeys:
                        description: AuditNonHMACRequestKeys are request keys that
                          should not be HMAC-hashed in audit logs
                        items:
                          type: string
                        type: array
                      auditNonHMACResponseKeys:
                        description: AuditNonHMACResponseKeys are response keys that
                          should not be HMAC-hashed in audit logs
                        items:
                          type: string
                        type: array
                      defaultLeaseTTL:
                        description: DefaultLeaseTTL is the default lease TTL (e.g.
                          "1h", "86400")
                        type: string
                      forceNoCache:
                        description: ForceNoCache disables caching for reads
                        type: boolean
                      listingVisibility:
                        description: ListingVisibility controls visibility in the
                          UI ("hidden" | "unauth")
                        enum:
                        - ""
                        - hidden
                        - unauth
                        type: string
                      maxLeaseTTL:
                        description: MaxLeaseTTL is the maximum lease TTL (e.g. "24h")
                        type: string
                      passthroughRequestHeaders:
                        description: PassthroughRequestHeaders are HTTP headers passed
                          directly to the plugin
                        items:
                          type: string
                        type: array
                    type: object
                  description:
                    description: Description is an optional description of the mount
                    type: string
                  local:
                    description: Local indicates the mount is local-only (ignored
                      in replication)
                    type: boolean
                  options:
                    additionalProperties:
                      type: string
                    description: 'Options are mount-specific options (e.g. {"version":
                      "2"} for KV)'
                    type: object
                  path:
                    description: |-
                      Path is the mount path (e.g. "secret", "pki", "transit")
                      Note: The regex intentionally constrains the path to a single segment (no slashes allowed)
                      to prevent nested mount structures for this specific resource scope.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  sealWrap:
                    description: SealWrap enables additional encryption with the Seal
                      Key
                    type: boolean
                  type:
                    description: Type is the engine type (e.g. "kv", "pki", "transit",
                      "database")
                    maxLength: 64
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: type of a secret engine is immutable once created
                      rule: self == oldSelf
                required:
                - path
                - type
                type: object
              maxItems: 50
              type: array
              x-kubernetes-list-map-keys:
              - path
              x-kubernetes-list-type: map
          required:
          - auth
          type: object
          x-kubernetes-validations:
          - message: openBaoNamespace is required when parentRef is set
            rule: '!has(self.parentRef) || (has(self.openBaoNamespace) && size(self.openBaoNamespace)
              > 0)'
          - message: parentRef is immutable once set
            rule: '!has(oldSelf.parentRef) || (has(self.parentRef) && self.parentRef
              == oldSelf.parentRef)'
          - message: openBaoNamespace is immutable once set
            rule: '!has(oldSelf.openBaoNamespace) || (has(self.openBaoNamespace) &&
              self.openBaoNamespace == oldSelf.openBaoNamespace)'
        status:
          description: OpenBaoNamespaceStatus defines the observed state of OpenBaoNamespace.
          properties:
            access:
              description: Access contains information for accessing the namespace.
              properties:
                authMethod:
                  description: AuthMethod is the configured auth method type.
                  type: string
                authMountPoint:
                  description: AuthMountPoint is the mount point of the auth method
