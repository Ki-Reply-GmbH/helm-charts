apiVersion: ui.platform-mesh.io/v1alpha1
kind: ContentConfiguration
metadata:
  labels:
    ui.platform-mesh.io/entity: core_platform-mesh_io_account
    ui.platform-mesh.io/content-for: openbao.apeiro.dev
  # Kept as openbao-ui (rather than the upstream chart's "openbao") so this replaces
  # the previous generic-list-view configuration in place instead of adding a second
  # OpenBao entry to the portal navigation on already-running clusters.
  name: openbao-ui
spec:
  remoteConfiguration:
    # Fetched by extension-manager-operator, so this resolves in-cluster. The JSON it
    # serves carries the browser-facing iframe URL, which the openbao-ui chart renders
    # from its httpRoute values as https://openbao-ui.services.portal.localhost:8443.
    url: "http://openbao-ui-openbao-ui.openbao-provider.svc.cluster.local/pm-content.json"
    contentType: json
