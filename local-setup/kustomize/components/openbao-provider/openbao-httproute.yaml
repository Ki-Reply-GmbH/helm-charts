apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao-ui
  namespace: openbao-provider
spec:
  hostnames:
    - openbao.services.portal.localhost
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: k8sapi-gateway
      namespace: platform-mesh-system
      sectionName: terminate-services
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: openbao
          port: 8200
