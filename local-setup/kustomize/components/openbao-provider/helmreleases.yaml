apiVersion: v1
kind: Namespace
metadata:
  name: openbao-provider
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-instance
  namespace: default
spec:
  chart:
    spec:
      chart: openbao-instance
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-local
        namespace: flux-system
  interval: 1m
  releaseName: openbao-instance
  targetNamespace: openbao-provider
  timeout: 15m # use 15m when stable
  values:
    config:
      devMode: false
    initJob:
      enabled: true
      openbaoAddress: "http://openbao:8200"
      operatorServiceAccount: "openbao-operator-controller-manager"
      operatorNamespace: "openbao-provider"
      operatorRole: "openbao-operator"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-operator
  namespace: default
spec:
  dependsOn:
    - name: openbao-instance
  chart:
    spec:
      chart: openbao-operator
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-local
        namespace: flux-system
  interval: 1m
  releaseName: openbao-operator
  targetNamespace: openbao-provider
  timeout: 15m # use 15m when stable
  values:
    leaderElection:
      enabled: false
    operator:
      openbaoAddress: "http://openbao.openbao-provider.svc:8200"
      openbaoDisplayUrl: "https://openbao.services.portal.localhost:8443/ui"
      openbaoAuthMethod: "kubernetes"
      openbaoK8sRole: "openbao-operator"
      apiexportEndpointsliceName: "openbao.apeiro.dev"
    hostAliases:
      - ip: "10.96.188.4"
        hostnames:
          - "localhost"
          - "portal.localhost"
          - "kcp.localhost"
          - "root.kcp.localhost"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-ui
  namespace: default
spec:
  dependsOn:
    - name: openbao-operator
  chart:
    spec:
      chart: openbao-ui
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-local
        namespace: flux-system
  interval: 1m
  # Release name is load-bearing: the ContentConfiguration applied into kcp resolves
  # this UI at <release>-openbao-ui.openbao-provider.svc.cluster.local.
  releaseName: openbao-ui
  targetNamespace: openbao-provider
  timeout: 15m # use 15m when stable
  values:
    # Local setup reaches the UI through the shared platform-mesh gateway,
    # not the public ingress host used in real environments.
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      port: 8443
      hostnames:
        - openbao-ui.services.portal.localhost
