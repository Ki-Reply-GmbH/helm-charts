apiVersion: v1
kind: Namespace
metadata:
  name: openbao-provider
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-instance
  namespace: default
spec:
  chart:
    spec:
      chart: openbao-instance
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-local
        namespace: flux-system
  interval: 1m
  releaseName: openbao-instance
  targetNamespace: openbao-provider
  timeout: 15m # use 15m when stable
  values:
    config:
      devMode: false
    initJob:
      enabled: true
      openbaoAddress: "http://openbao:8200"
      operatorServiceAccount: "openbao-operator-controller-manager"
      operatorNamespace: "openbao-provider"
      operatorRole: "openbao-operator"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-operator
  namespace: default
spec:
  dependsOn:
    - name: openbao-instance
  chart:
    spec:
      chart: openbao-operator
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-local
        namespace: flux-system
  interval: 1m
  releaseName: openbao-operator
  targetNamespace: openbao-provider
  timeout: 15m # use 15m when stable
  values:
    leaderElection:
      enabled: false
    operator:
      openbaoAddress: "http://openbao.openbao-provider.svc:8200"
      openbaoDisplayUrl: "https://openbao.services.portal.localhost:8443"
      openbaoAuthMethod: "kubernetes"
      openbaoK8sRole: "openbao-operator"
      apiexportEndpointsliceName: "openbao.apeiro.dev"
    hostAliases:
      - ip: "10.96.188.4"
        hostnames:
          - "localhost"
          - "portal.localhost"
          - "kcp.localhost"
          - "root.kcp.localhost"
