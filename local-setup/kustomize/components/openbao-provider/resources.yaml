apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: chart
    repo: oci
  name: openbao-instance-chart
  namespace: default
spec:
  componentRef:
    name: platform-mesh
  ocmConfig:
  - apiVersion: delivery.ocm.software/v1alpha1
    kind: Repository
    name: platform-mesh
    namespace: default
    policy: Propagate
  resource:
    byReference:
      referencePath:
      - name: openbao-instance
      - name: chart
      resource:
        name: chart
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: chart
    repo: oci
  name: openbao-operator-chart
  namespace: default
spec:
  componentRef:
    name: platform-mesh
  ocmConfig:
  - apiVersion: delivery.ocm.software/v1alpha1
    kind: Repository
    name: platform-mesh
    namespace: default
    policy: Propagate
  resource:
    byReference:
      referencePath:
      - name: openbao-operator
      - name: chart
      resource:
        name: chart
