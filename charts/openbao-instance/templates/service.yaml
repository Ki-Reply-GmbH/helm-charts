apiVersion: v1
kind: Service
metadata:
  name: openbao
  labels:
    {{- include "openbao-instance.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8200
      protocol: TCP
      name: http
  selector:
    {{- include "openbao-instance.selectorLabels" . | nindent 4 }}
