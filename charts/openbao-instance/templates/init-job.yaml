{{- if .Values.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openbao-instance.fullname" . }}-init-k8s-auth
  labels:
    {{- include "openbao-instance.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-job
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "openbao-instance.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init-job
    spec:
      restartPolicy: {{ .Values.initJob.restartPolicy }}
      serviceAccountName: {{ include "openbao-instance.serviceAccountName" . }}
      containers:
      - name: init-k8s-auth
        image: "{{ .Values.initJob.image.registry }}/{{ .Values.initJob.image.repository }}:{{ .Values.initJob.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/sh
          - -c
          - |
            set -e

            echo "Waiting for OpenBao to be ready..."
            until bao status 2>/dev/null; do
              echo "  OpenBao not ready yet, waiting..."
              sleep 2
            done
            echo "OpenBao is ready!"

            echo "Enabling Kubernetes auth backend..."
            if bao auth list | grep -q 'kubernetes/'; then
              echo "  Kubernetes auth already enabled"
            else
              bao auth enable kubernetes
              echo "  Kubernetes auth enabled"
            fi

            echo "Configuring Kubernetes auth..."
            bao write auth/kubernetes/config \
              kubernetes_host="https://kubernetes.default.svc:443" \
              kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            echo "  Kubernetes auth configured"

            echo "Creating operator policy..."
            bao policy write {{ .Values.initJob.operatorPolicyName }} - <<EOF
            # Allow operator to manage namespaces
            path "sys/namespaces/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }

            # Allow operator to manage policies
            path "sys/policies/acl/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }

            # Allow operator to manage auth methods
            path "auth/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }

            # Allow operator to manage identity
            path "identity/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }

            # Allow operator to read system health
            path "sys/health" {
              capabilities = ["read"]
            }
            EOF
            echo "  Operator policy created"

            echo "Creating Kubernetes auth role for operator..."
            bao write auth/kubernetes/role/{{ .Values.initJob.operatorRole }} \
              bound_service_account_names="{{ .Values.initJob.operatorServiceAccount }}" \
              bound_service_account_namespaces="{{ .Values.initJob.operatorNamespace }}" \
              policies="{{ .Values.initJob.operatorPolicyName }}" \
              ttl=1h
            echo "  Operator role created"

            echo "Init job completed successfully!"
        env:
          - name: BAO_ADDR
            value: {{ .Values.initJob.openbaoAddress | quote }}
          - name: BAO_TOKEN
            valueFrom:
              secretKeyRef:
                name: openbao-root-token
                key: token
          - name: SKIP_SETCAP
            value: "true"
        resources:
          {{- toYaml .Values.initJob.resources | nindent 12 }}
        volumeMounts:
          - name: sa-token
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
{{- end }}
