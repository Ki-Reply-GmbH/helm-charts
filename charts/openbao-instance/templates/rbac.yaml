apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openbao-instance.fullname" . }}-tokenreview
  labels:
    {{- include "openbao-instance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "openbao-instance.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.initJob.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openbao-instance.fullname" . }}-init
  labels:
    {{- include "openbao-instance.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openbao-instance.fullname" . }}-init
  labels:
    {{- include "openbao-instance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openbao-instance.fullname" . }}-init
subjects:
  - kind: ServiceAccount
    name: {{ include "openbao-instance.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
