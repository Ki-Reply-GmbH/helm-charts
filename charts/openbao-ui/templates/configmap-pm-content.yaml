apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openbao-ui.fullname" . }}-content
  labels:
    {{- include "openbao-ui.labels" . | nindent 4 }}
data:
  pm-content.json: |-
    {{- $host := include "openbao-ui.externalUrl" . -}}
    {{- $navigation := .Values.navigation | default dict -}}
    {{- $accountOrder := (get $navigation "accountOrder" | default 900 | toString) -}}
    {{- $tpl := .Files.Get "pm-content.json.tpl" -}}
    {{- $rendered := $tpl | replace "__HOST__" $host | replace "__GRAPHQL_URL__" .Values.graphql.url | replace "__ACCOUNT_NAMESPACE__" .Values.accountNamespace | replace "__ACCOUNT_NAV_ORDER__" $accountOrder -}}
    {{ $rendered | nindent 4 }}
  pm-content-namespace.json: |-
    {{- $namespaceCategoryOrder := (get $navigation "namespaceCategoryOrder" | default 900 | toString) -}}
    {{- $namespaceTpl := .Files.Get "pm-content-namespace.json.tpl" -}}
    {{- $namespaceRendered := $namespaceTpl | replace "__HOST__" $host | replace "__GRAPHQL_URL__" .Values.graphql.url | replace "__ACCOUNT_NAMESPACE__" .Values.accountNamespace | replace "__NAMESPACE_CATEGORY_ORDER__" $namespaceCategoryOrder -}}
    {{ $namespaceRendered | nindent 4 }}
