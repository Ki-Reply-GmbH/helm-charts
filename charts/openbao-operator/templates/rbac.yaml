{{- if .Values.apiSyncagent.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-syncagent:openbaotenant-provider
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - openbao.apeiro.dev
    resources:
      - openbaotenants
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - openbao.apeiro.dev
    resources:
      - openbaotenants/status
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-syncagent:openbaotenant-provider
  labels:
    {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-syncagent:openbaotenant-provider
subjects:
  - kind: ServiceAccount
    name: {{ .Values.apiSyncagent.serviceAccount.name }}
    namespace: {{ .Values.apiSyncagent.serviceAccount.namespace }}
{{- end }}
